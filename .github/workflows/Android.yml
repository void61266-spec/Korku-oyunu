name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Android SDK paketleri
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "cmdline-tools;latest"

      - name: Godot ve export şablonlarını indir
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> $GITHUB_ENV

      - name: Debug keystore ve Godot ayarları
        run: |
          mkdir -p ~/.android ~/.config/godot build
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          JAVA_DIR="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_DIR"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOS

      - name: Projeyi içe aktar
        run: $GODOT --headless --path . --import || true

      - name: Duman testi
        run: $GODOT --headless --path . res://tests/smoke.tscn

      - name: Debug APK derle
        run: $GODOT --headless --path . --export-debug "Android Debug" build/void_son_vardiya_debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: void-son-vardiya-debug-apk
          path: build/*.apk
